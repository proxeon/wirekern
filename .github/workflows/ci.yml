name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  # Issue 026: all-features green says nothing about a lone feature's
  # build — every supported minimal combination must hold strict clippy
  # and its own tests on its own.
  feature-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["", "oauth", "client", "bluesky", "threads", "meta-ads", "draft"]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p postkit --no-default-features --features "${{ matrix.features }}" --all-targets -- -D warnings
      - run: cargo test -p postkit --no-default-features --features "${{ matrix.features }}"
