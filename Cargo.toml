[workspace]
resolver = "2"
members = ["crates/postkit", "crates/postkit-cli", "crates/postkit-serve"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
description = "Official-API execution kernel. BYO credentials. No calendar."
repository = "https://github.com/proxeon/postkit"
homepage = "https://github.com/proxeon/postkit"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-std"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
getrandom = "0.3"
sha2 = "0.10"
emojis = "0.6"
rpassword = "7"
unicode-segmentation = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting", "parsing"] }
