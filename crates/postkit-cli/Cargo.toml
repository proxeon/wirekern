[package]
name = "postkit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for the postkit execution kernel. Flags compile to the same JSON as Client."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["social", "publish", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "postkit"
path = "src/main.rs"

[dependencies]
postkit = { version = "0.1.0", path = "../postkit", features = ["vault-file", "threads", "bluesky", "meta-ads", "facebook-pages", "instagram", "whatsapp-cloud", "draft"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "io-std", "net", "signal"] }
rpassword = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[dev-dependencies]
tempfile = "3"
