[package]
name = "postkit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for the postkit execution kernel. Flags compile to the same JSON as Client."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["social", "publish", "cli"]
categories = ["command-line-utilities"]

[[bin]]
name = "postkit"
path = "src/main.rs"

[dependencies]
postkit = { version = "0.1.0", path = "../postkit", features = ["vault-file", "threads", "bluesky", "meta-ads", "facebook-pages", "instagram", "whatsapp-cloud", "draft"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
rpassword = { workspace = true }

[dev-dependencies]
tempfile = "3"
