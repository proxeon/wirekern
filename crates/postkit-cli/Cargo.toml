[package]
name = "postkit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CLI for postkit. Flags compile to the same JSON as Client."

[[bin]]
name = "postkit"
path = "src/main.rs"

[dependencies]
postkit = { path = "../postkit", features = ["vault-file"] }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
