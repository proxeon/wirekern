[package]
name = "postkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["social", "publish", "threads", "cli"]
categories = ["api-bindings", "command-line-utilities"]

[features]
default = []
vault-file = []
client = ["dep:reqwest"]
oauth = ["client", "dep:getrandom"]
threads = ["client", "oauth", "dep:tokio", "dep:emojis"]
bluesky = ["client", "dep:unicode-segmentation", "dep:time"]
meta-ads = ["client", "oauth", "dep:tokio"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
emojis = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
httpmock = "0.7"
tempfile = "3"
libc = "0.2"
