[package]
name = "postkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["social", "publish", "threads", "cli"]
categories = ["api-bindings", "command-line-utilities"]

[features]
default = []
vault-file = []
client = ["dep:reqwest"]
oauth = ["client", "dep:getrandom"]
threads = ["client", "oauth", "dep:tokio", "dep:emojis"]
bluesky = ["client", "dep:unicode-segmentation", "dep:time"]
meta-ads = ["client", "oauth", "dep:tokio"]
facebook-pages = ["client", "oauth"]
# Instagram Login is a distinct OAuth surface from Facebook Pages and Ads.
# Keep it independent so applications can ship direct Instagram publishing
# without pulling another Meta connector into their dependency graph.
# Container readiness is an asynchronous Meta-side fetch, so the connector
# needs Tokio only to perform bounded status polling before its final write.
instagram = ["client", "oauth", "dep:tokio"]
# WhatsApp Cloud uses a static bearer token rather than an OAuth redirect.
# HMAC-SHA256 verifies the raw inbound webhook body before it is parsed.
whatsapp-cloud = ["client", "dep:hmac", "dep:sha2"]
draft = ["client", "dep:tokio", "dep:sha2"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
reqwest = { workspace = true, optional = true }
getrandom = { workspace = true, optional = true }
emojis = { workspace = true, optional = true }
unicode-segmentation = { workspace = true, optional = true }
time = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hmac = { version = "0.12", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }
httpmock = "0.7"
tempfile = "3"
libc = "0.2"
