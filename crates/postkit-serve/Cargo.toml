[package]
name = "postkit-serve"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local HTTP surface for postkit. Same JSON as the CLI. pk_live_ keys."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["social", "publish", "http"]
categories = ["web-programming::http-server"]

[[bin]]
name = "postkit-serve"
path = "src/main.rs"

[dependencies]
postkit = { version = "0.1.0", path = "../postkit", features = ["vault-file", "threads", "bluesky", "meta-ads", "facebook-pages", "instagram", "whatsapp-cloud"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "signal"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1", "query"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
clap = { workspace = true }

[dev-dependencies]
tempfile = "3"
async-trait = { workspace = true }
